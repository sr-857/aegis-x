name: Local Dev

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: \${{ github.workflow }}-\${{ github.ref }}
  cancel-in-progress: true

jobs:
  local-dev-build:
    name: Local Dev Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: local-dev
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "local-dev/package-lock.json"

      - name: Install dependencies
        run: npm install

      - name: TypeScript check
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Preview build
        run: npm run preview &
        sleep 5
        curl -s -o /dev/null -w "%{http_code}" http://localhost:4173/